<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rincón de las Moñas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#FDF8F3;
    --primary:#F0C4CE;
    --accent:#C97B93;
    --text:#4A3B3F;
    --card:#FFFFFF;
    --line:#F0DDE2;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Nunito Sans',sans-serif;
    line-height:1.5;
    padding-bottom:60px;
  }
  h1,h2,h3,.serif{font-family:'Fraunces',serif;}

  /* ---------- Hero ---------- */
  .hero{
    padding:64px 24px 48px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .hero::before{
    content:"";
    position:absolute;
    top:-80px; right:-60px;
    width:220px; height:220px;
    background:var(--primary);
    border-radius:50%;
    opacity:.35;
    filter:blur(2px);
  }
  .hero::after{
    content:"";
    position:absolute;
    bottom:-100px; left:-70px;
    width:260px; height:260px;
    background:var(--primary);
    border-radius:50%;
    opacity:.25;
  }
  .hero-inner{position:relative; z-index:1;}
  .hero h1{
    font-size:clamp(2.2rem,7vw,3.4rem);
    font-weight:600;
    font-style:italic;
    color:var(--accent);
    letter-spacing:.01em;
  }
  .hero p.tagline{
    margin-top:10px;
    font-size:1.05rem;
    color:var(--text);
    opacity:.75;
    font-style:italic;
    font-family:'Fraunces',serif;
  }
  .hero .deco-line{
    width:64px; height:2px;
    background:var(--accent);
    opacity:.4;
    margin:22px auto 0;
    border-radius:2px;
  }
  .hero .custom-order-btn{
    margin-top:24px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:#fff;
    color:var(--accent);
    border:1.5px solid var(--accent);
    border-radius:999px;
    padding:11px 22px;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
  }
  .hero .custom-order-btn:active{opacity:.8;}

  /* ---------- Nav de categorías ---------- */
  .cat-nav{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:8px 20px 20px;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  .cat-nav::-webkit-scrollbar{display:none;}
  .cat-pill{
    flex:0 0 auto;
    padding:9px 20px;
    border-radius:999px;
    background:var(--card);
    border:1.5px solid var(--line);
    color:var(--text);
    font-weight:700;
    font-size:.92rem;
    cursor:pointer;
    transition:background .15s, border-color .15s, color .15s;
    white-space:nowrap;
  }
  .cat-pill.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }

  /* ---------- Grid de productos ---------- */
  .catalog{
    max-width:1000px;
    margin:0 auto;
    padding:0 20px;
  }
  .cat-section{margin-bottom:38px;}
  .cat-section h2{
    font-size:1.5rem;
    font-weight:500;
    color:var(--accent);
    margin-bottom:16px;
    padding-left:2px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:16px;
  }
  .card{
    background:var(--card);
    border-radius:18px;
    overflow:hidden;
    border:1px solid var(--line);
    display:flex;
    flex-direction:column;
    transition:transform .15s, box-shadow .15s;
  }
  .card:active{transform:scale(.98);}
  .card-photo{
    aspect-ratio:1/1;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    cursor:pointer;
    overflow:hidden;
  }
  .card-photo img{
    width:100%; height:100%;
    object-fit:cover;
  }
  .card-photo .no-photo{
    color:var(--line);
    font-size:2.2rem;
  }
  .badge{
    position:absolute;
    top:8px; left:8px;
    background:var(--primary);
    color:var(--accent);
    font-size:.68rem;
    font-weight:800;
    padding:3px 9px;
    border-radius:999px;
    letter-spacing:.02em;
  }
  .badge.out{
    background:#eee;
    color:#999;
  }
  .badge.low-stock{
    background:#FFE8CC;
    color:#B5680B;
  }
  .card-body{
    padding:12px 14px 14px;
    display:flex;
    flex-direction:column;
    gap:4px;
    flex:1;
  }
  .card-body h3{
    font-size:.98rem;
    font-weight:600;
    line-height:1.25;
  }
  .card-body p.desc{
    font-size:.82rem;
    color:var(--text);
    opacity:.7;
    flex:1;
  }
  .card-body .price{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.15rem;
    color:var(--accent);
    margin-top:2px;
  }
  .wa-btn{
    margin-top:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:12px;
    padding:9px;
    font-weight:700;
    font-size:.85rem;
    cursor:pointer;
    text-decoration:none;
  }
  .wa-btn:active{opacity:.85;}
  .wa-btn.disabled{
    background:#e8e2de;
    color:#a89a94;
    pointer-events:none;
  }
  .wa-btn svg{width:16px;height:16px;flex:none;}

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--text);
    opacity:.6;
    font-family:'Fraunces',serif;
    font-style:italic;
  }

  /* ---------- Producto destacado (enlace directo) ---------- */
  .spotlight-wrap{
    max-width:1000px;
    margin:0 auto 34px;
    padding:0 20px;
  }
  .spotlight-label{
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--accent);
    font-weight:800;
    font-size:.85rem;
    margin-bottom:12px;
    letter-spacing:.02em;
  }
  .spotlight-card{
    background:var(--card);
    border-radius:20px;
    border:2px solid var(--accent);
    box-shadow:0 8px 28px rgba(201,123,147,.22);
    overflow:hidden;
    display:grid;
    grid-template-columns:1fr;
    animation:spotlight-in .5s ease;
  }
  @media(min-width:560px){
    .spotlight-card{grid-template-columns:220px 1fr;}
  }
  @keyframes spotlight-in{
    from{opacity:0; transform:translateY(-8px);}
    to{opacity:1; transform:translateY(0);}
  }
  .spotlight-photo{
    aspect-ratio:1/1;
    background:#fff;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    position:relative;
  }
  .spotlight-photo img{width:100%; height:100%; object-fit:cover;}
  .spotlight-photo .no-photo{font-size:3rem; color:var(--line);}
  .spotlight-body{
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .spotlight-body h3{font-size:1.25rem; font-weight:600;}
  .spotlight-body p.desc{font-size:.9rem; opacity:.75; flex:0;}
  .spotlight-body .price{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.4rem;
    color:var(--accent);
  }
  .spotlight-body .wa-btn{max-width:260px; margin-top:10px;}

  /* ---------- Aviso tienda cerrada ---------- */
  .closed-banner{
    max-width:1000px;
    margin:0 auto 24px;
    padding:0 20px;
  }
  .closed-banner-inner{
    background:#FFF3E0;
    color:#8A5A00;
    border-radius:14px;
    padding:16px 18px;
    font-size:.9rem;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:12px;
    border:1.5px solid #F0D9A8;
  }
  .closed-banner-inner .cb-icon{font-size:1.4rem; flex:none;}

  /* ---------- Formulario de pedido / encargo ---------- */
  .order-btn{
    margin-top:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    background:#fff;
    color:var(--accent);
    border:1.5px solid var(--accent);
    border-radius:12px;
    padding:8px;
    font-weight:700;
    font-size:.82rem;
    cursor:pointer;
    width:100%;
  }
  .order-modal-overlay{
    position:fixed; inset:0;
    background:rgba(74,59,63,.6);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:90;
    padding:0;
  }
  .order-modal-overlay.open{display:flex;}
  .order-modal{
    background:var(--bg);
    width:100%;
    max-width:480px;
    border-radius:22px 22px 0 0;
    padding:22px 20px 26px;
    max-height:90vh;
    overflow-y:auto;
  }
  @media(min-width:560px){
    .order-modal-overlay{align-items:center;}
    .order-modal{border-radius:22px;}
  }
  .order-modal h3{color:var(--accent); font-size:1.15rem; margin-bottom:4px;}
  .order-modal .om-product{font-size:.85rem; opacity:.7; margin-bottom:16px;}
  .order-modal label{display:block; font-size:.8rem; font-weight:700; margin-bottom:5px; opacity:.75;}
  .order-modal .field{margin-bottom:12px;}
  .order-modal input, .order-modal textarea, .order-modal select{
    width:100%; padding:10px 12px;
    border:1.5px solid var(--line); border-radius:10px;
    font-size:.92rem; background:#fff; color:var(--text);
    font-family:inherit;
  }
  .order-modal textarea{min-height:60px; resize:vertical;}
  .order-modal .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .order-modal .om-actions{display:flex; gap:10px; margin-top:16px;}
  .order-modal .om-btn{
    flex:1; padding:11px; border-radius:12px; border:none;
    font-weight:700; font-size:.9rem; cursor:pointer;
  }
  .order-modal .om-cancel{background:#fff; border:1.5px solid var(--line); color:var(--text);}
  .order-modal .om-send{background:var(--accent); color:#fff;}
  .order-modal .om-send:disabled{opacity:.6; pointer-events:none;}
  .order-confirm{
    text-align:center; padding:20px 10px;
  }
  .order-confirm .big-check{font-size:2.4rem; margin-bottom:8px;}

  .delivery-note{
    background:var(--primary);
    color:var(--accent);
    border-radius:10px;
    padding:9px 12px;
    font-size:.78rem;
    font-weight:600;
    margin:-2px 0 12px;
    display:none;
  }
  .delivery-note.show{display:block;}

  .checkbox-field{
    display:flex; align-items:center; gap:9px;
    margin-bottom:12px;
  }
  .checkbox-field input{width:auto; flex:none;}
  .checkbox-field label{margin:0; font-weight:700; font-size:.85rem; opacity:1;}

  .nequi-box{
    background:#fff;
    border:1.5px dashed var(--accent);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:12px;
    display:none;
  }
  .nequi-box.show{display:block;}
  .nequi-box .nq-number{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.2rem;
    color:var(--accent);
    margin:4px 0 8px;
  }
  .nequi-box p{font-size:.78rem; opacity:.75;}
  .proof-upload-btn{
    display:flex; align-items:center; justify-content:center; gap:6px;
    background:#fff; border:1.5px solid var(--line); border-radius:10px;
    padding:10px; font-size:.85rem; font-weight:700; color:var(--text);
    cursor:pointer; margin-top:8px;
  }
  .proof-preview{
    display:flex; align-items:center; gap:8px; margin-top:8px;
    font-size:.8rem; background:var(--bg); border-radius:8px; padding:6px 10px;
  }
  .proof-preview img{width:36px; height:36px; border-radius:6px; object-fit:cover;}

  /* ---------- Footer ---------- */
  footer{
    max-width:1000px;
    margin:50px auto 0;
    padding:28px 24px 0;
    border-top:1px solid var(--line);
    text-align:center;
  }
  footer .biz{font-family:'Fraunces',serif; font-style:italic; color:var(--accent); font-size:1.05rem;}
  footer .meta{font-size:.85rem; opacity:.65; margin-top:6px;}
  footer .socials{margin-top:14px; display:flex; gap:14px; justify-content:center;}
  footer .socials a{
    color:var(--accent);
    text-decoration:none;
    font-weight:700;
    font-size:.85rem;
    border:1.5px solid var(--line);
    padding:7px 16px;
    border-radius:999px;
  }

  /* ---------- Lightbox ---------- */
  .lightbox{
    position:fixed; inset:0;
    background:rgba(74,59,63,.85);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:24px;
  }
  .lightbox.open{display:flex;}
  .lightbox img{
    max-width:100%; max-height:85vh;
    border-radius:12px;
    background:#fff;
  }
  .lightbox-close{
    position:absolute;
    top:20px; right:20px;
    width:40px; height:40px;
    border-radius:50%;
    background:#fff;
    border:none;
    font-size:1.3rem;
    cursor:pointer;
    color:var(--text);
  }

  .loading{
    text-align:center;
    padding:60px 20px;
    opacity:.5;
    font-family:'Fraunces',serif;
    font-style:italic;
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <h1 id="biz-name">Rincón de las Moñas</h1>
    <p class="tagline" id="biz-tagline">Hecho a mano con amor</p>
    <div class="deco-line"></div>
    <button class="custom-order-btn" id="open-custom-order-btn">✨ Hacer un encargo especial</button>
  </div>
</div>

<nav class="cat-nav" id="cat-nav"></nav>

<div class="closed-banner" id="closed-banner" style="display:none;">
  <div class="closed-banner-inner">
    <span class="cb-icon">🧵</span> <span id="closed-message"></span>
  </div>
</div>

<div class="spotlight-wrap" id="spotlight-wrap" style="display:none;">
  <div class="spotlight-label">✨ Te comparten esto</div>
  <div class="spotlight-card" id="spotlight-card"></div>
</div>

<main class="catalog" id="catalog">
  <div class="loading">Cargando catálogo…</div>
</main>

<footer>
  <div class="biz" id="footer-biz">Rincón de las Moñas</div>
  <div class="meta" id="footer-meta">Entrega en persona en Barranquilla</div>
  <div class="socials" id="footer-socials"></div>
</footer>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightbox-close">✕</button>
  <img id="lightbox-img" src="" alt="">
</div>

<div class="order-modal-overlay" id="order-modal-overlay">
  <div class="order-modal" id="order-modal-content"></div>
</div>

<script>
// ============================================================
// CONFIGURA AQUÍ TU PROYECTO DE SUPABASE
// ============================================================
const SUPABASE_URL = 'https://djzqfnhbhwmdiftfmcsq.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_qjYeH9YAwmZAd4rCoE_2xg_cg0yhUb5';
// ============================================================

const sb = (SUPABASE_URL.startsWith('http'))
  ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

let CONFIG = {
  business_name: 'Rincón de las Moñas',
  tagline: 'Hecho a mano con amor',
  color_bg: '#FDF8F3',
  color_primary: '#F0C4CE',
  color_accent: '#C97B93',
  color_text: '#4A3B3F',
  whatsapp_number: '3008853826',
  nequi_number: '3008853826',
  nequi_holder_name: 'Norelis Johana Vizcaino Bustamante',
  low_stock_threshold: 3,
  facebook_url: '',
  city: 'Barranquilla',
  is_open: true,
  closed_message: 'Por ahora no estamos recibiendo pedidos nuevos. ¡Vuelve pronto!'
};

// ---- Datos de ejemplo (se usan si Supabase no está configurado aún) ----
const DEMO_CATEGORIES = [
  { id: 'c1', name: 'Toallas', sort_order: 0 },
  { id: 'c2', name: 'Moñas', sort_order: 1 },
  { id: 'c3', name: 'Vinchas', sort_order: 2 }
];
const DEMO_PRODUCTS = [
  { id:'p1', category_id:'c1', name:'Toalla bordada floral', description:'Toalla de mano bordada a mano, algodón suave.', price:18000, is_combo:false, in_stock:true, photos:[] },
  { id:'p2', category_id:'c1', name:'Set 2 toallas juego de baño', description:'Combo de 2 toallas a juego, ideal para regalo.', price:32000, is_combo:true, in_stock:true, photos:[] },
  { id:'p3', category_id:'c2', name:'Moña doble lazo rosa', description:'Moña grande tipo lazo, elástico suave.', price:8000, is_combo:false, in_stock:true, photos:[] },
  { id:'p4', category_id:'c2', name:'Set 3 moñas pastel', description:'Combo de 3 moñas en tonos pastel surtidos.', price:20000, is_combo:true, in_stock:false, photos:[] },
  { id:'p5', category_id:'c3', name:'Vincha perlas', description:'Vincha delicada con detalle de perlas.', price:12000, is_combo:false, in_stock:true, photos:[] }
];

function money(n){
  return '$' + Number(n).toLocaleString('es-CO');
}

function applyConfig(cfg){
  CONFIG = { ...CONFIG, ...cfg };
  const root = document.documentElement.style;
  root.setProperty('--bg', CONFIG.color_bg);
  root.setProperty('--primary', CONFIG.color_primary);
  root.setProperty('--accent', CONFIG.color_accent);
  root.setProperty('--text', CONFIG.color_text);
  document.title = CONFIG.business_name;
  document.getElementById('biz-name').textContent = CONFIG.business_name;
  document.getElementById('biz-tagline').textContent = CONFIG.tagline;
  document.getElementById('footer-biz').textContent = CONFIG.business_name;
  document.getElementById('footer-meta').textContent = 'Entrega en persona en ' + CONFIG.city;

  const socials = document.getElementById('footer-socials');
  socials.innerHTML = '';
  if(CONFIG.whatsapp_number){
    const a = document.createElement('a');
    a.href = waLink(CONFIG.whatsapp_number, `Hola, quiero más información sobre ${CONFIG.business_name} 🌸`);
    a.target = '_blank';
    a.textContent = 'WhatsApp';
    socials.appendChild(a);
  }
  if(CONFIG.facebook_url){
    const a = document.createElement('a');
    a.href = CONFIG.facebook_url;
    a.target = '_blank';
    a.textContent = 'Facebook';
    socials.appendChild(a);
  }

  const banner = document.getElementById('closed-banner');
  const customOrderBtn = document.getElementById('open-custom-order-btn');
  if(!CONFIG.is_open){
    document.getElementById('closed-message').textContent = CONFIG.closed_message;
    banner.style.display = 'block';
    customOrderBtn.disabled = true;
    customOrderBtn.style.opacity = '.5';
    customOrderBtn.style.pointerEvents = 'none';
  } else {
    banner.style.display = 'none';
    customOrderBtn.disabled = false;
    customOrderBtn.style.opacity = '1';
    customOrderBtn.style.pointerEvents = 'auto';
  }
}

function waLink(number, text){
  const clean = number.replace(/\D/g,'');
  const withCountry = clean.startsWith('57') ? clean : '57' + clean;
  return `https://wa.me/${withCountry}?text=${encodeURIComponent(text)}`;
}

function productWaLink(p){
  const msg = `Hola 🌸 Me interesa "${p.name}" (${money(p.price)}). ¿Está disponible?`;
  return waLink(CONFIG.whatsapp_number, msg);
}

let activeCategory = 'all';

function renderNav(categories){
  const nav = document.getElementById('cat-nav');
  nav.innerHTML = '';
  const allPill = makePill('all', 'Todo');
  nav.appendChild(allPill);
  categories.forEach(c => nav.appendChild(makePill(c.id, c.name)));
}

function makePill(id, label){
  const btn = document.createElement('button');
  btn.className = 'cat-pill' + (activeCategory === id ? ' active' : '');
  btn.textContent = label;
  btn.onclick = () => { activeCategory = id; refreshCatalogView(); };
  return btn;
}

let ALL_CATEGORIES = [];
let ALL_PRODUCTS = [];

function refreshCatalogView(){
  renderNav(ALL_CATEGORIES);
  renderCatalog(ALL_CATEGORIES, ALL_PRODUCTS);
  renderSpotlight();
}

function getSpotlightId(){
  const params = new URLSearchParams(window.location.search);
  return params.get('producto');
}

function renderSpotlight(){
  const wrap = document.getElementById('spotlight-wrap');
  const spotlightId = getSpotlightId();
  if(!spotlightId){
    wrap.style.display = 'none';
    return;
  }
  const p = ALL_PRODUCTS.find(prod => prod.id === spotlightId);
  if(!p){
    wrap.style.display = 'none';
    return;
  }

  const card = document.getElementById('spotlight-card');
  const photoUrl = (p.photos && p.photos[0]) ? p.photos[0] : null;
  const canOrder = p.in_stock && CONFIG.is_open;
  const isLowStock = p.in_stock && (p.stock_quantity ?? 1) > 0 && (p.stock_quantity ?? 1) <= (CONFIG.low_stock_threshold ?? 3);

  card.innerHTML = `
    <div class="spotlight-photo">
      ${photoUrl ? `<img src="${photoUrl}" alt="${escapeHtml(p.name)}">` : '<span class="no-photo">🌸</span>'}
      ${isLowStock ? `<span class="badge low-stock" style="position:absolute;top:8px;left:8px;">¡Solo quedan ${p.stock_quantity}!</span>` : ''}
    </div>
    <div class="spotlight-body">
      <h3>${escapeHtml(p.name)}</h3>
      ${p.description ? `<p class="desc">${escapeHtml(p.description)}</p>` : ''}
      <div class="price">${money(p.price)}</div>
      <a class="wa-btn${canOrder ? '' : ' disabled'}" href="${canOrder ? productWaLink(p) : '#'}" target="_blank">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.48 1.32 4.99L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.2h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2zm0 18.06c-1.5 0-2.97-.4-4.25-1.16l-.3-.18-3.15.83.84-3.07-.2-.32a8.06 8.06 0 0 1-1.24-4.25c0-4.46 3.63-8.09 8.1-8.09 2.16 0 4.2.85 5.72 2.37a8.03 8.03 0 0 1 2.37 5.72c0 4.47-3.63 8.15-8.09 8.15z"/></svg>
        ${p.in_stock ? (CONFIG.is_open ? 'Pedir por WhatsApp' : 'Tienda cerrada') : 'Agotado por ahora'}
      </a>
      ${canOrder ? `<button class="order-btn" id="spotlight-order-btn" style="max-width:260px;">Hacer pedido</button>` : ''}
    </div>
  `;

  wrap.style.display = 'block';

  const spotlightOrderBtn = document.getElementById('spotlight-order-btn');
  if(spotlightOrderBtn) spotlightOrderBtn.onclick = () => openOrderModal(p);

  if(p.category_id) activeCategory = p.category_id;
  setTimeout(() => wrap.scrollIntoView({ behavior:'smooth', block:'start' }), 150);
}

function renderCatalog(categories, products){
  const catalog = document.getElementById('catalog');
  catalog.innerHTML = '';

  const visibleCats = activeCategory === 'all'
    ? categories
    : categories.filter(c => c.id === activeCategory);

  let anyRendered = false;

  visibleCats.forEach(cat => {
    const items = products.filter(p => p.category_id === cat.id);
    if(items.length === 0) return;
    anyRendered = true;

    const section = document.createElement('section');
    section.className = 'cat-section';
    section.innerHTML = `<h2>${cat.name}</h2>`;
    const grid = document.createElement('div');
    grid.className = 'grid';

    items.forEach(p => grid.appendChild(renderCard(p)));
    section.appendChild(grid);
    catalog.appendChild(section);
  });

  if(!anyRendered){
    catalog.innerHTML = '<div class="empty-state">Muy pronto verás productos por aquí 🌷</div>';
  }
}

function renderCard(p){
  const card = document.createElement('article');
  card.className = 'card';

  const photo = document.createElement('div');
  photo.className = 'card-photo';
  const photoUrl = (p.photos && p.photos[0]) ? p.photos[0] : null;
  if(photoUrl){
    const img = document.createElement('img');
    img.src = photoUrl;
    img.alt = p.name;
    img.loading = 'lazy';
    photo.appendChild(img);
    photo.onclick = () => openLightbox(photoUrl, p.name);
  } else {
    photo.innerHTML = '<span class="no-photo">🌸</span>';
  }

  const isLowStock = p.in_stock && (p.stock_quantity ?? 1) > 0 && (p.stock_quantity ?? 1) <= (CONFIG.low_stock_threshold ?? 3);

  if(p.is_combo){
    const b = document.createElement('span');
    b.className = 'badge';
    b.textContent = 'Combo';
    photo.appendChild(b);
  } else if(!p.in_stock){
    const b = document.createElement('span');
    b.className = 'badge out';
    b.textContent = 'Agotado';
    photo.appendChild(b);
  } else if(isLowStock){
    const b = document.createElement('span');
    b.className = 'badge low-stock';
    b.textContent = `¡Solo quedan ${p.stock_quantity}!`;
    photo.appendChild(b);
  }

  const body = document.createElement('div');
  body.className = 'card-body';
  body.innerHTML = `
    <h3>${escapeHtml(p.name)}</h3>
    ${p.description ? `<p class="desc">${escapeHtml(p.description)}</p>` : ''}
    <div class="price">${money(p.price)}</div>
  `;

  const btn = document.createElement('a');
  const canOrder = p.in_stock && CONFIG.is_open;
  btn.className = 'wa-btn' + (canOrder ? '' : ' disabled');
  btn.href = canOrder ? productWaLink(p) : '#';
  btn.target = '_blank';
  btn.innerHTML = `
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.48 1.32 4.99L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.2h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2zm0 18.06c-1.5 0-2.97-.4-4.25-1.16l-.3-.18-3.15.83.84-3.07-.2-.32a8.06 8.06 0 0 1-1.24-4.25c0-4.46 3.63-8.09 8.1-8.09 2.16 0 4.2.85 5.72 2.37a8.03 8.03 0 0 1 2.37 5.72c0 4.47-3.63 8.15-8.09 8.15z"/></svg>
    ${p.in_stock ? (CONFIG.is_open ? 'Pedir por WhatsApp' : 'Tienda cerrada') : 'Agotado por ahora'}
  `;

  body.appendChild(btn);

  if(canOrder){
    const orderBtn = document.createElement('button');
    orderBtn.className = 'order-btn';
    orderBtn.textContent = 'Hacer pedido';
    orderBtn.onclick = () => openOrderModal(p);
    body.appendChild(orderBtn);
  }

  card.appendChild(photo);
  card.appendChild(body);
  return card;
}

function escapeHtml(s){
  const div = document.createElement('div');
  div.textContent = s || '';
  return div.innerHTML;
}

function openLightbox(url, alt){
  document.getElementById('lightbox-img').src = url;
  document.getElementById('lightbox-img').alt = alt;
  document.getElementById('lightbox').classList.add('open');
}
document.getElementById('lightbox-close').onclick = () => document.getElementById('lightbox').classList.remove('open');
document.getElementById('lightbox').onclick = (e) => { if(e.target.id === 'lightbox') e.target.classList.remove('open'); };

async function loadFromSupabase(){
  const { data: cfg } = await sb.from('site_config').select('*').eq('id', 1).single();
  if(cfg) applyConfig(cfg);

  const { data: categories } = await sb.from('categories').select('*').order('sort_order');
  const { data: products } = await sb.from('products').select('*').order('sort_order');
  const { data: photos } = await sb.from('product_photos').select('*').order('sort_order');

  const photosByProduct = {};
  (photos || []).forEach(ph => {
    if(!photosByProduct[ph.product_id]) photosByProduct[ph.product_id] = [];
    photosByProduct[ph.product_id].push(ph.photo_url);
  });

  ALL_CATEGORIES = categories || [];
  ALL_PRODUCTS = (products || []).map(p => ({
    ...p,
    photos: photosByProduct[p.id] || []
  }));

  refreshCatalogView();
}

function loadDemo(){
  applyConfig(CONFIG);
  ALL_CATEGORIES = DEMO_CATEGORIES;
  ALL_PRODUCTS = DEMO_PRODUCTS;
  refreshCatalogView();
}

// ---------------- Helpers compartidos: dirección/domicilio/pago adelantado ----------------

function deliveryAndPaymentFieldsHTML(){
  return `
    <div class="field">
      <label>¿Cómo prefieres recibirlo?</label>
      <select id="om-delivery">
        <option value="recoge">Yo lo recojo</option>
        <option value="domicilio">Necesito que me lo lleven</option>
      </select>
    </div>
    <div class="delivery-note" id="om-delivery-note">
      🚚 El envío se confirma por WhatsApp según tu zona: si quedas muy cerca es gratis, si es más lejos puede tener un costo adicional.
    </div>
    <div class="field">
      <label>Dirección</label>
      <input type="text" id="om-address" placeholder="Barrio, calle, referencia...">
    </div>
    <div class="checkbox-field">
      <input type="checkbox" id="om-advance">
      <label for="om-advance">Pagaré por adelantado</label>
    </div>
    <div class="nequi-box" id="om-nequi-box">
      <div style="font-size:.8rem; font-weight:700;">Nequi</div>
      <div class="nq-number" id="om-nequi-number"></div>
      <p id="om-nequi-holder" style="margin-bottom:6px;"></p>
      <p>Haz la transferencia y sube aquí una foto del comprobante.</p>
      <button type="button" class="proof-upload-btn" id="om-proof-btn">📎 Subir comprobante</button>
      <input type="file" id="om-proof-input" accept="image/*" style="display:none">
      <div id="om-proof-preview"></div>
    </div>
  `;
}

function wireDeliveryAndPaymentFields(){
  const deliverySel = document.getElementById('om-delivery');
  const note = document.getElementById('om-delivery-note');
  deliverySel.onchange = () => {
    note.classList.toggle('show', deliverySel.value === 'domicilio');
  };

  const advanceChk = document.getElementById('om-advance');
  const nequiBox = document.getElementById('om-nequi-box');
  document.getElementById('om-nequi-number').textContent = CONFIG.nequi_number || '—';
  document.getElementById('om-nequi-holder').textContent = CONFIG.nequi_holder_name
    ? `A nombre de: ${CONFIG.nequi_holder_name}`
    : '';
  advanceChk.onchange = () => {
    nequiBox.classList.toggle('show', advanceChk.checked);
  };

  const proofBtn = document.getElementById('om-proof-btn');
  const proofInput = document.getElementById('om-proof-input');
  proofBtn.onclick = () => proofInput.click();
  proofInput.onchange = () => {
    const file = proofInput.files[0];
    const preview = document.getElementById('om-proof-preview');
    if(!file){ preview.innerHTML = ''; return; }
    const localUrl = URL.createObjectURL(file);
    preview.innerHTML = `<div class="proof-preview"><img src="${localUrl}"><span>${escapeHtml(file.name)}</span></div>`;
  };
}

function getDeliveryAndPaymentValues(){
  return {
    delivery_method: document.getElementById('om-delivery').value,
    address: document.getElementById('om-address').value.trim(),
    advance_payment: document.getElementById('om-advance').checked,
    proofFile: document.getElementById('om-proof-input').files[0] || null
  };
}

async function uploadProofIfAny(proofFile){
  if(!proofFile || !sb) return null;
  const ext = proofFile.name.split('.').pop();
  const path = `${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
  const { error } = await sb.storage.from('payment-proofs').upload(path, proofFile);
  if(error){ console.error('Error subiendo comprobante:', error); return null; }
  const { data } = sb.storage.from('payment-proofs').getPublicUrl(path);
  return data.publicUrl;
}

// ---------------- Formulario de pedido (producto del catálogo) ----------------
function openOrderModal(p){
  const overlay = document.getElementById('order-modal-overlay');
  const content = document.getElementById('order-modal-content');
  content.innerHTML = `
    <h3>Hacer pedido</h3>
    <div class="om-product">${escapeHtml(p.name)} · ${money(p.price)}</div>
    <div class="field">
      <label>Tu nombre</label>
      <input type="text" id="om-name" placeholder="¿Cómo te llamas?">
    </div>
    <div class="field">
      <label>Cantidad</label>
      <input type="number" id="om-qty" value="1" min="1">
    </div>
    ${deliveryAndPaymentFieldsHTML()}
    <div class="field">
      <label>Nota (opcional)</label>
      <textarea id="om-note" placeholder="Ej: color, talla, para cuándo lo necesitas..."></textarea>
    </div>
    <div class="om-actions">
      <button class="om-btn om-cancel" id="om-cancel">Cancelar</button>
      <button class="om-btn om-send" id="om-send">Enviar pedido</button>
    </div>
  `;
  overlay.classList.add('open');
  wireDeliveryAndPaymentFields();

  document.getElementById('om-cancel').onclick = () => overlay.classList.remove('open');

  document.getElementById('om-send').onclick = async () => {
    if(!CONFIG.is_open){
      alert('Lo sentimos, no estamos recibiendo pedidos en este momento.');
      return;
    }
    const name = document.getElementById('om-name').value.trim();
    const qty = Number(document.getElementById('om-qty').value) || 1;
    const note = document.getElementById('om-note').value.trim();
    const { delivery_method, address, advance_payment, proofFile } = getDeliveryAndPaymentValues();

    if(!name){ alert('Por favor escribe tu nombre.'); return; }
    if(!address){ alert('Por favor escribe tu dirección.'); return; }

    const sendBtn = document.getElementById('om-send');
    sendBtn.disabled = true;
    sendBtn.textContent = 'Enviando…';

    let payment_proof_url = null;
    if(advance_payment && proofFile){
      payment_proof_url = await uploadProofIfAny(proofFile);
    }

    if(sb){
      try{
        await sb.from('orders').insert({
          product_id: p.id,
          product_name: p.name,
          product_price: p.price,
          customer_name: name,
          quantity: qty,
          note: note,
          address: address,
          delivery_method: delivery_method,
          advance_payment: advance_payment,
          payment_proof_url: payment_proof_url
        });
      }catch(e){
        console.error('Error guardando pedido:', e);
      }
    }

    content.innerHTML = `
      <div class="order-confirm">
        <div class="big-check">🌸</div>
        <h3>¡Pedido recibido!</h3>
        <p style="font-size:.9rem; opacity:.75; margin-top:6px;">Ahora escríbenos por WhatsApp para confirmar los detalles.</p>
        <div class="om-actions" style="margin-top:18px;">
          <button class="om-btn om-cancel" id="om-close">Cerrar</button>
          <a class="om-btn om-send" style="text-decoration:none; display:flex; align-items:center; justify-content:center;"
             href="${waLink(CONFIG.whatsapp_number, `Hola 🌸 Acabo de hacer un pedido de "${p.name}" (x${qty}) a nombre de ${name}. Dirección: ${address} (${delivery_method === 'domicilio' ? 'domicilio' : 'lo recojo yo'}). ${advance_payment ? 'Ya hice el pago adelantado.' : ''} ${note ? 'Nota: ' + note : ''}`)}"
             target="_blank">Ir a WhatsApp</a>
        </div>
      </div>
    `;
    document.getElementById('om-close').onclick = () => overlay.classList.remove('open');
  };
}

// ---------------- Formulario de encargo especial (independiente del catálogo) ----------------
function openCustomOrderModal(){
  const overlay = document.getElementById('order-modal-overlay');
  const content = document.getElementById('order-modal-content');
  content.innerHTML = `
    <h3>Hacer un encargo especial</h3>
    <div class="om-product">Cuéntanos qué tienes en mente y coordinamos los detalles.</div>
    <div class="field">
      <label>Tu nombre</label>
      <input type="text" id="om-name" placeholder="¿Cómo te llamas?">
    </div>
    <div class="field">
      <label>¿Qué quieres encargar?</label>
      <textarea id="om-desc" placeholder="Describe el encargo: tipo de moña, colores, cantidad, etc."></textarea>
    </div>
    <div class="row2">
      <div class="field">
        <label>Lo necesito desde</label>
        <input type="date" id="om-date-from">
      </div>
      <div class="field">
        <label>hasta</label>
        <input type="date" id="om-date-to">
      </div>
    </div>
    ${deliveryAndPaymentFieldsHTML()}
    <div class="field">
      <label>Nota (opcional)</label>
      <textarea id="om-note" placeholder="Algo más que debamos saber..."></textarea>
    </div>
    <div class="om-actions">
      <button class="om-btn om-cancel" id="om-cancel">Cancelar</button>
      <button class="om-btn om-send" id="om-send">Enviar encargo</button>
    </div>
  `;
  overlay.classList.add('open');
  wireDeliveryAndPaymentFields();

  document.getElementById('om-cancel').onclick = () => overlay.classList.remove('open');

  document.getElementById('om-send').onclick = async () => {
    if(!CONFIG.is_open){
      alert('Lo sentimos, no estamos recibiendo encargos en este momento.');
      return;
    }
    const name = document.getElementById('om-name').value.trim();
    const description = document.getElementById('om-desc').value.trim();
    const dateFrom = document.getElementById('om-date-from').value;
    const dateTo = document.getElementById('om-date-to').value;
    const note = document.getElementById('om-note').value.trim();
    const { delivery_method, address, advance_payment, proofFile } = getDeliveryAndPaymentValues();

    if(!name){ alert('Por favor escribe tu nombre.'); return; }
    if(!description){ alert('Cuéntanos qué quieres encargar.'); return; }
    if(!address){ alert('Por favor escribe tu dirección.'); return; }
    if(!dateFrom || !dateTo){ alert('Indica el rango de fechas en que lo necesitas.'); return; }
    if(dateTo < dateFrom){ alert('La fecha "hasta" no puede ser anterior a "desde".'); return; }

    const sendBtn = document.getElementById('om-send');
    sendBtn.disabled = true;
    sendBtn.textContent = 'Enviando…';

    let payment_proof_url = null;
    if(advance_payment && proofFile){
      payment_proof_url = await uploadProofIfAny(proofFile);
    }

    if(sb){
      try{
        await sb.from('custom_orders').insert({
          customer_name: name,
          description: description,
          date_from: dateFrom,
          date_to: dateTo,
          note: note,
          address: address,
          delivery_method: delivery_method,
          advance_payment: advance_payment,
          payment_proof_url: payment_proof_url
        });
      }catch(e){
        console.error('Error guardando encargo:', e);
      }
    }

    content.innerHTML = `
      <div class="order-confirm">
        <div class="big-check">✨</div>
        <h3>¡Encargo recibido!</h3>
        <p style="font-size:.9rem; opacity:.75; margin-top:6px;">Ahora escríbenos por WhatsApp para confirmar los detalles.</p>
        <div class="om-actions" style="margin-top:18px;">
          <button class="om-btn om-cancel" id="om-close">Cerrar</button>
          <a class="om-btn om-send" style="text-decoration:none; display:flex; align-items:center; justify-content:center;"
             href="${waLink(CONFIG.whatsapp_number, `Hola 🌸 Quiero hacer un encargo especial: "${description}". Lo necesito entre ${dateFrom} y ${dateTo}. Dirección: ${address} (${delivery_method === 'domicilio' ? 'domicilio' : 'lo recojo yo'}). A nombre de ${name}. ${advance_payment ? 'Ya hice el pago adelantado.' : ''} ${note ? 'Nota: ' + note : ''}`)}"
             target="_blank">Ir a WhatsApp</a>
        </div>
      </div>
    `;
    document.getElementById('om-close').onclick = () => overlay.classList.remove('open');
  };
}

document.getElementById('open-custom-order-btn').onclick = () => {
  if(!CONFIG.is_open){
    alert('Lo sentimos, no estamos recibiendo encargos en este momento.');
    return;
  }
  openCustomOrderModal();
};

document.getElementById('order-modal-overlay').onclick = (e) => {
  if(e.target.id === 'order-modal-overlay') e.target.classList.remove('open');
};

async function init(){
  if(sb){
    try {
      await loadFromSupabase();
    } catch(e){
      console.error('Error cargando Supabase, usando datos de ejemplo:', e);
      loadDemo();
    }
  } else {
    loadDemo();
  }
}

init();
</script>
